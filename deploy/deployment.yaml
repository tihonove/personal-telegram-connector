apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # Одна Telegram-сессия — один процесс: две копии ловят AUTH_KEY_DUPLICATED.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: app
          args: ["http", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: SECRETS_DIR
              value: /run/secrets/app
            - name: PUBLIC_HOST
              value: tg-mcp.tihonove.dev
            - name: TG_DEVICE_NAME
              value: tg-mcp prod
            - name: TIMEZONE
              value: Asia/Yekaterinburg
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
